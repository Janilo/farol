name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem `version:` de propósito. A versão do pnpm vem do campo
      # `packageManager` do package.json, que é a fonte única — declarar nos dois
      # lugares faz a action abortar com "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # O build (vite) não checa tipos: sem este passo, erro de tipo passa
      # verde no CI e só aparece no editor de quem abrir o arquivo.
      - run: pnpm run typecheck
      - run: pnpm run test
