name: CI

# O deploy vive AQUI, e não num `deploy.yml` separado, por um motivo que custou um
# incidente em 30/jul/2026: dois workflows no mesmo `push` disparam em PARALELO, e
# `needs:` só existe entre jobs do MESMO arquivo. Com os arquivos separados, a
# Fase 4 subiu para produção com o lint reprovado — o CI vermelho não segurava
# nada. Juntar os dois é o que torna o portão estrutural em vez de decorativo.
#
# A alternativa examinada e recusada foi `workflow_run` mantendo os dois arquivos:
# exige `ref: head_sha` explícito no checkout, lê a definição sempre do branch
# default e depende de checar `conclusion == 'success'` à mão. Três lugares para
# errar em silêncio contra um `needs:` que o próprio Actions garante.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem `version:` de propósito. A versão do pnpm vem do campo
      # `packageManager` do package.json, que é a fonte única — declarar nos dois
      # lugares faz a action abortar com "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # O build (vite) não checa tipos: sem este passo, erro de tipo passa
      # verde no CI e só aparece no editor de quem abrir o arquivo.
      - run: pnpm run typecheck
      - run: pnpm run test

  deploy:
    # O portão. Sem isto, o job roda em paralelo com os testes.
    needs: lint-and-test
    # `pull_request` também dispara este workflow, e PR não faz deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Mesma razão do job acima: a versão do pnpm vem do `packageManager`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vite + Nitro (cloudflare-module) gera o Worker em dist/ e o config de
      # deploy em .wrangler/deploy/config.json (lido automaticamente pelo wrangler).
      # As VITE_ são chaves públicas (anon) — mesmas de wrangler.jsonc/.env.example —
      # injetadas no bundle client em build-time. Secrets reais ficam no Worker.
      - name: Build (Vite + Nitro cloudflare-module)
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://sscnhpcyvcsgtacundgc.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Nog8EYSMeMHD9I6TQjPY3A_QizWblz7
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "latest"
          command: deploy
