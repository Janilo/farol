name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # O build (vite) não checa tipos: sem este passo, erro de tipo passa
      # verde no CI e só aparece no editor de quem abrir o arquivo.
      - run: pnpm run typecheck
      - run: pnpm run test
