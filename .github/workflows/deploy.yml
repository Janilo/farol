name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem `version:` de propósito. A versão do pnpm vem do campo
      # `packageManager` do package.json, que é a fonte única — declarar nos dois
      # lugares faz a action abortar com "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vite + Nitro (cloudflare-module) gera o Worker em dist/ e o config de
      # deploy em .wrangler/deploy/config.json (lido automaticamente pelo wrangler).
      # As VITE_ são chaves públicas (anon) — mesmas de wrangler.jsonc/.env.example —
      # injetadas no bundle client em build-time. Secrets reais ficam no Worker.
      - name: Build (Vite + Nitro cloudflare-module)
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://sscnhpcyvcsgtacundgc.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Nog8EYSMeMHD9I6TQjPY3A_QizWblz7
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "latest"
          command: deploy
