<!-- Do projeto "JPS DS — Farol" (claude.ai/design), 28/jul/2026. Fonte:
     Design/JPS DS Farol.zip → assets/farol-favicon.svg. O .ico multi-resolução
     e o apple-touch-icon vêm do mesmo export.
     SEM <text>, e a regra é geral (docs/DESIGN.md §5): .svg servido como
     documento isolado — favicon, <img src> — não vê a @font-face da página e
     cai em fonte de sistema. Asset de marca em .svg não leva texto.
     O anel é --farol-ink e a luz é --farol-beam-bright, igual ao wordmark:
     o anel é a letra, o âmbar é a luz. Hex cru porque documento isolado não
     vê os tokens --farol-*. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="farol">
  <title>farol — favicon: a lente, sem tipografia</title>
  <defs>
    <radialGradient id="fhalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6D073" stop-opacity=".60"></stop>
      <stop offset="55%" stop-color="#F6D073" stop-opacity=".18"></stop>
      <stop offset="100%" stop-color="#F6D073" stop-opacity="0"></stop>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="5" fill="#0D1113"></rect>
  <circle cx="16" cy="16" r="9.4" fill="none" stroke="#F2F0EA" stroke-width="3.4"></circle>
  <circle cx="16" cy="16" r="8" fill="url(#fhalo)"></circle>
  <circle cx="16" cy="16" r="4.2" fill="#F6D073"></circle>
</svg>