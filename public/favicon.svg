<!-- Favicon do Farol: a lente do facho, sem tipografia.
     A 16px o wordmark inteiro não lê, então o glifo simplifica para a lente
     (docs/DESIGN.md §5 e §8). SEM <text>: um .svg carregado como documento
     isolado (favicon, <img src>) não vê a @font-face da página e cai numa
     fonte de sistema. A versão anterior tinha os dois problemas — era o
     "jps" roxo do DS-mãe (#4A1942, a paleta descartada na §1) em <text>.
     Hex cru porque documento isolado não vê os tokens --farol-*.
     Proporções da lente: anel 0,20 do diâmetro, disco 0,41 (spec §5). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Farol">
  <rect width="64" height="64" fill="#0D1113"/>
  <circle cx="32" cy="32" r="17.6" fill="none" stroke="#E8B93F" stroke-width="8.8"/>
  <circle cx="32" cy="32" r="9" fill="#F6D073"/>
</svg>
